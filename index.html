<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080a10"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><title>Discipline Quest</title><style>
*{box-sizing:border-box}body{margin:0;background:#080a10;color:#f4f6fb;font-family:system-ui,sans-serif}.app{max-width:520px;margin:auto;padding-bottom:90px}.top{padding:22px 18px 10px}.brand{font-size:25px;font-weight:900}.muted{color:#98a1b5}.tiny{font-size:11px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.card{margin:10px 16px;padding:16px;border:1px solid #252c3c;background:#121722;border-radius:20px}.hero{background:linear-gradient(145deg,#211c3d,#111521);border-color:#463876}.level{font-size:34px;font-weight:900}.bar,.xp{height:9px;background:#292f3e;border-radius:99px;overflow:hidden}.bar i,.xp i{display:block;height:100%;background:#8b6cff}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 16px}.stat{padding:15px;border:1px solid #252c3c;border-radius:17px;background:#111521}.big{font-size:25px;font-weight:900}.label,.section{font-size:11px;color:#98a1b5;font-weight:900;letter-spacing:.08em}.section{margin:20px 18px 8px}.quest{display:flex;gap:12px;align-items:center}.qicon{width:44px;height:44px;border-radius:14px;background:#242a3a;display:grid;place-items:center;font-size:21px}.grow{flex:1}.reward{font-size:11px;color:#b5a6ff}.btn{border:0;border-radius:13px;padding:11px 14px;background:#8b6cff;color:#fff;font-weight:800}.btn.secondary{background:#252c3b}.nav{position:fixed;z-index:5;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:78px;background:#0e121bfa;border-top:1px solid #252c3c;display:grid;grid-template-columns:repeat(6,1fr)}.nav button{background:none;border:0;color:#8791a5;font-size:10px}.nav b{display:block;font-size:18px;margin-bottom:3px}.nav .active{color:#b19cff}.field{margin:9px 0}.field label{display:block;font-size:11px;color:#98a1b5;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #30384a;background:#0b0e16;color:white;border-radius:12px}.achievement{display:flex;gap:12px;padding:12px 0;border-bottom:1px sol </style></head><body><div id="app"></div><script src="app.js"></script></body></html>
